# Project config for verify-ui and agent pipeline
# Generated by /project-setup — adjust navigation and paths as the product grows

appRoot: .

devCommand: pnpm dev
devUrl: http://localhost:5173

checksCommand: pnpm checks
e2eCommand: pnpm test:e2e

styleguide: docs/UI_STYLEGUIDE.md
designDir: .qa/design
acceptanceDir: .qa/acceptance
evidenceDir: .qa/evidence

locale: en

# Secure-by-Default — written by @project-setup into AGENTS.md + .qa/edge-cases.md.
# @ecc-check / @audit-changes / @review-ticket / @test-gate read this to know the checklist is active.
security:
  checklist: secure-by-default   # "secure-by-default" | "disabled" (legacy projects)

# @typed-strict — programming languages (NOT UI locale). From PRD (Node/TS monorepo); detect found none yet.
typedStrict:
  languages:
    - typescript

# @test-gate — deterministic tools/scripts (no AI review). See ~/.claude/skills/test-gate/
# detect-stack.sh currently reports PROFILE=unknown (empty repo). Planned stack is pnpm monorepo.
testGate:
  profile: monorepo
  depthDefault: standard
  runner: scripts
  primaryLanguage: ts
  appKind: monorepo
  always:
    - typedStrict
    - secureByDefault
    - rgSecretsDiff
  optional:
    - npmAudit
  never:
    - aiReview
    - explanationCheck
    - fallow
    - updateReadme
    - mutation

# @issue-contract — canonical GitHub issue template (global default).
issueContract:
  template: global
  labels: [P0, P1, P2, needs-design]
  maxAcceptanceBullets: 5
  runtimeAxes: [local-cli, local-dashboard, ci]
  securitySection: true
  locale: en

viewports:
  - name: mobile
    width: 390
    height: 844
  - name: tablet
    width: 768
    height: 1024
  - name: desktop
    width: 1280
    height: 720

# Planned dashboard routes from docs/PRD.md §10 — screens do not exist yet
navigation:
  - Setup detect
  - Setup doctor
  - Project
  - Scenarios
  - Profiles
  - New run
  - Live run
  - Run detail
  - Compare
  - Rules
  - Settings
